<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Your MD Representative</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
      line-height: 1.5;
    }
    textarea {
      width: 100%;
      height: 150px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      margin-bottom: 15px;
    }
    button {
      background-color: #0056b3;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
    }
    button:hover {
      background-color: #003d82;
    }
    .status {
      margin-top: 10px;
      font-size: 14px;
      color: #28a745;
    }
  </style>
</head>
<body>

  <h2>Nuclear Fuel Storage - Contact Your Representative (MD)</h2>
  <p>Edit or copy the message below, then proceed to the official U.S. House lookup tool to find your representative's contact page.</p>

  <textarea id="message">Hello, my name is <NAME>, and I am one of your constituents and a student at the University of Maryland. I am writing to you because there is an issue that I feel is important to the health of this country and the environment. 

I believe it is critically important that we find a solution to nuclear fuel storage, and it makes me sad that our solution is as temporary as it is. Storing fuel rods in cooling pools is not sufficient, especially when there are known solutions.

Yuca Mountain was a solution to the nuclear waste problem, but now it's clear that it is very unlikely that Nevada would ever sign off on storing the nuclear waste. I am writing to ask that you prioritize the process of determining a new location where nuclear waste can be stored, and that you help to change the law such that waste may be stored there, and that federal funds can be used to help construct the facility.

Thank you for your consideration, and I hope that you seriously consider improving the disposal of nuclear waste.

  Sincerely,

<NAME>
  </textarea>

  <button onclick="copyAndRedirect()">Copy Message & Go to Contact Page</button>
  <div id="status" class="status"></div>

  <script>
    async function copyAndRedirect() {
      const text = document.getElementById('message').value;
      const statusDiv = document.getElementById('status');

      try {
        await navigator.clipboard.writeText(text);
        statusDiv.innerText = "Copied to clipboard! Redirecting...";
        
        // Wait 1 second so the user sees confirmation before tab changes/redirects
        setTimeout(() => {
          window.location.href = "https://www.house.gov/representatives/find-your-representative";
        }, 1000);
      } catch (err) {
        statusDiv.style.color = "#dc3545";
        statusDiv.innerText = "Failed to copy automatically. Please copy the text manually.";
      }
    }
  </script>

</body>
</html>
